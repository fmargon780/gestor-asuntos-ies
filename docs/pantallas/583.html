:root{color-scheme:light;--azul:#1f3a5f;--azul2:#2c5d8f;--borde:#e3e7ee;--gris:#6b7280;--verde:#e7f6ec;--verdet:#17663a;--ambar:#fff4d6}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;color:#1d2430;background:#fff}
.franja{background:#7a5a12;color:#fff;text-align:center;font-size:12px;padding:4px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 24px)}
nav{background:var(--azul);color:#dfe8f3;padding:14px 10px}
nav b{display:block;color:#fff;font-size:15px;margin:8px 8px 18px}
nav a{display:block;padding:8px 10px;border-radius:6px;color:#dfe8f3;text-decoration:none;margin-bottom:2px}
nav a.on{background:var(--azul2);color:#fff;font-weight:600}
nav hr{border:0;border-top:1px solid #3b5679;margin:10px 0}
main{padding:18px 26px}
.cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cab h1{font-size:22px;margin:0 14px 0 0}
.pest{display:flex;gap:4px}
.pest button{border:1px solid var(--borde);background:#f6f8fb;border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit}
.pest button.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.esp{flex:1}
button,select,input{font:inherit}
.b{border:1px solid #cfd6e0;background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.b.p{background:var(--azul);color:#fff;border-color:var(--azul)}
.b:disabled{opacity:.45;cursor:default}
.b.l{border:0;background:none;color:var(--azul2);padding:2px 4px;text-decoration:underline}
input[type=text],input[type=number],input[type=date],select{border:1px solid #cfd6e0;border-radius:6px;padding:6px 8px;background:#fff}
.ayuda{color:var(--gris);font-size:13px;margin:6px 0 12px}
table{border-collapse:collapse;width:100%}
th{font-size:12px;color:var(--gris);text-align:left;font-weight:600;border-bottom:1px solid var(--borde);padding:6px 8px;white-space:nowrap}
td{border-bottom:1px solid var(--borde);padding:7px 8px;vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tr.sel td{background:#eef4fb}
.viejo{color:#9aa1ab}
.chip{white-space:nowrap;display:inline-block;font-size:11px;background:#eef1f5;border-radius:10px;padding:1px 8px;color:#445}
.barato{background:var(--verde);color:var(--verdet);font-weight:600}
.apuntar{display:grid;grid-template-columns:minmax(0,1fr) 210px 90px auto;gap:8px;align-items:center;max-width:none;position:relative;margin:14px 0 8px}
.sug{position:absolute;top:38px;left:0;right:420px;background:#fff;border:1px solid #cfd6e0;border-radius:6px;box-shadow:0 6px 18px #0002;z-index:5;max-height:300px;overflow:auto}
.sug div{padding:7px 10px;cursor:pointer}.sug div:hover,.sug div.act{background:#eef4fb}
.sug .nuevo{border-top:1px solid var(--borde);color:var(--azul2)}
.acc{display:flex;gap:8px;align-items:center;margin:4px 0 8px}
.cat3{display:grid;grid-template-columns:180px minmax(0,1fr) minmax(0,1.15fr);gap:16px;margin-top:14px}
.caja{border:1px solid var(--borde);border-radius:8px;padding:10px}
.caja h3{font-size:14px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.lc div{padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between}
.lc div.on{background:var(--azul);color:#fff}
.capa{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:20}
.cuadro{background:#fff;border-radius:10px;width:min(1340px,96vw);max-height:90vh;display:flex;flex-direction:column}
.cuadro.chico{width:min(520px,94vw)}
.cuadro h2{font-size:17px;margin:0;padding:14px 18px;border-bottom:1px solid var(--borde)}
.cuadro .cu{padding:14px 18px;overflow:auto}
.cuadro .pie{padding:10px 18px;border-top:1px solid var(--borde);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.fila{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px;align-items:center;margin-bottom:8px}
.difer{background:#fde8e8}.celda{cursor:pointer}.celda.asig{outline:2px solid #2c5d8f;outline-offset:-2px;font-weight:600}.celda:hover{outline:1px dashed var(--azul2)}
.edit{display:flex;gap:4px;flex-wrap:wrap}.edit input{width:80px}
.aviso{position:fixed;right:18px;bottom:18px;background:#17663a;color:#fff;padding:10px 14px;border-radius:8px;max-width:420px;z-index:30;box-shadow:0 6px 18px #0003}
.ped{border:1px solid var(--borde);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.ped h3{margin:0 0 6px;font-size:14px}
th.prov{min-width:120px}
.cuadro td:first-child{min-width:220px}
@media(max-width:900px){.app{grid-template-columns:1fr}nav{display:none}.cat3{grid-template-columns:1fr}}
</style>
</head>

const fecha=f=>{const [a,m,d]=f.split('-');return `${+d}-${['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][m-1]}-${a}`};

let falta=[
 {id:1,a:'a1',c:20,q:'Diego',f:'2026-11-18',para:'Administración'},
 {id:2,a:'a5',c:2,q:'Francisco',f:'2026-11-20',para:'Administración'},

 {id:5,a:'a9',c:2,q:'Diego',f:'2026-11-24',para:'Administración'}];

cats.forEach(c=>{c.vals={};c.car.forEach((k,i)=>c.vals[k]=[...new Set(arts.filter(z=>z.cat===c.id).map(z=>z.v[i]).filter(Boolean))].sort())});

const lista=(attr,vals)=>`<span style="display:flex;gap:6px"><select ${attr}><option value="">—</option>${vals.map(v=>`<option>${esc(v)}</option>`).join('')}<option value="__nuevo">+ Nuevo valor…</option></select><input type="text" data-nv hidden placeholder="Escribe el valor nuevo"></span>`;
const valorDe=sel=>sel.value==='__nuevo'?sel.nextElementSibling.value.trim():sel.value;
const engancharLista=(sel,alCambiar)=>{const nv=sel.nextElementSibling;sel.onchange=()=>{nv.hidden=sel.value!=='__nuevo';if(!nv.hidden)nv.focus();alCambiar()};nv.onchange=()=>{const v=nv.value.trim().toLowerCase(),o=[...sel.options].find(o=>o.value!==''&&o.value!=='__nuevo'&&o.value.toLowerCase()===v);
  if(o){sel.value=o.value;nv.hidden=true;nv.value='';aviso('Ya estaba en la lista: '+o.value+'. Elegido.')}alCambiar()};nv.oninput=alCambiar};
const igualA=(vals,v)=>vals.find(x=>x.toLowerCase()===v.toLowerCase());
let portesDe={0:60,1:100};let correos=['pedidos@papeleriacentral.es','ventas@dobla.es','imprentasol@gmail.com','comercial@ofiprix.es'];let gasto={0:3120.40,1:13250.00,2:860.00,3:0};const TOPE=15000;
let destinos=['Administración','Dirección','Jefatura de estudios','Conserjería','Dpto. de Lengua','Dpto. de Matemáticas'];let sigD=470;
let vista='falta', marc=new Set(), catSel='c1', artSel='a1', sigN=142, sigF=6;

function aviso(t){const e=document.getElementById('aviso');e.textContent=t;e.hidden=false;clearTimeout(aviso.t);aviso.t=setTimeout(()=>e.hidden=true,4500)}
const main=document.getElementById('main'), capa=document.getElementById('capa');
function cabecera(){return `<div class="cab"><h1>Material</h1><div class="pest">
 <button data-v="falta" class="${vista==='falta'?'on':''}">Lo que falta (${falta.length})</button>

function pintar(){if(vista==='asunto'){main.innerHTML=vAsunto();return}main.innerHTML=cabecera()+(vista==='falta'?vFalta():vista==='pedidos'?vPedidos():vista==='proveedores'?vProveedores():vCatalogo())}
let pedSel=null;
function pendDe(pi){return pedidos.filter(z=>z.p===pi&&!(z.fra&&z.fra.base)).reduce((t,z)=>t+z.l.reduce((u,l)=>u+l.c*l.pr,0),0)}
function vProveedores(){return `<p class="ayuda">Lo de cada proveedor en el año natural, sin IVA. El tope del contrato menor de suministros es ${eur(TOPE)}. «Facturado» suma las facturas; «pedido sin facturar», los pedidos aún sin factura.</p>
 <table><thead><tr><th>Proveedor</th><th>Correo</th><th>Portes gratis desde</th><th class="n">Facturado en 2026</th><th class="n">Pedido sin facturar</th><th style="width:28%">Hacia el tope de ${eur(TOPE)}</th></tr></thead><tbody>
 ${provs.map((pr,i)=>{const f=gasto[i]||0,pd=pendDe(i),t=f+pd,pc=Math.min(100,t/TOPE*100),col=t>=TOPE?'#b42318':t>=TOPE*0.8?'#d97706':'#2c5d8f';
  return `<tr><td>${esc(pr)}</td><td>${esc(correos[i]||'')}</td><td><button class="b l" data-portes2="${i}">${portesDe[i]!=null?eur(portesDe[i]):'sin apuntar'}</button></td><td class="n">${eur(f)}</td><td class="n">${eur(pd)}</td>
  <td><div style="background:#eef1f5;border-radius:4px;height:10px"><div style="width:${pc}%;background:${col};height:10px;border-radius:4px"></div></div><small style="color:${col}">${eur(t)} · ${Math.round(t/TOPE*100)} %${t>=TOPE?' · pasado del tope':t>=TOPE*0.8?' · cerca del tope':''}</small></td></tr>`}).join('')}</tbody></table>`}
function cuadroPresu(){const lin=falta.filter(x=>marc.has(x.id));let el=new Set();
 const pinta=()=>{cuadro('Pedir precios',`<p class="ayuda" style="margin-top:0">Se manda un correo a cada proveedor marcado, desde la cuenta de Administración, con esta lista. Cuando contesten, escribes sus precios en el catálogo o en el cuadro «Pedir».</p>
 <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px"><div>${provs.map((pr,i)=>`<label style="display:block;margin-bottom:6px"><input type="checkbox" data-pv="${i}" ${el.has(i)?'checked':''}> ${esc(pr)}<br><small class="viejo" style="margin-left:22px">${esc(correos[i])}</small></label>`).join('')}</div>
 <div class="caja" style="font-size:13px"><b>Asunto:</b> Petición de precios · IES Fuente Lucena<br><br>Buenos días:<br>Les rogamos nos indiquen precio sin IVA y plazo de entrega de:<ul style="margin:6px 0">${lin.map(x=>`<li>${esc(nom(x.a))}: ${x.c} × ${esc(artDe(x.a).u)}</li>`).join('')}</ul>Un saludo.<br>Administración</div></div>`,
 `<button class="b" id="x">Cancelar</button><button class="b p" id="ok" ${el.size?'':'disabled'}>Enviar ${el.size||''} correo${el.size===1?'':'s'}</button>`);
 capa.querySelectorAll('[data-pv]').forEach(c=>c.onchange=()=>{c.checked?el.add(+c.dataset.pv):el.delete(+c.dataset.pv);pinta()});
 document.getElementById('x').onclick=cerrar;

function prepara(p){p.rec=p.rec||p.l.map(l=>l.c);p.dev=p.dev||p.l.map(()=>0);p.fac=p.fac||p.l.map(()=>({c:'',pr:''}));p.fra=p.fra||{num:'',f:'',base:'',iva:'',tot:''};p.rec2=p.rec2||{num:'',f:'',base:'',iva:'',tot:''};p.junto=p.junto||[];return p}
function vAsunto(){const p=prepara(pedidos.find(z=>z.n===pedSel)),F=p.fra,R=p.rec2,num=v=>v===''||v==null?null:+v;
 const grupo=[p,...p.junto.map(n=>prepara(pedidos.find(z=>z.n===n)))];
 let sumF=0,dif=0,falta=0,abono=0,nDev=0,pend=0;
 const filas=grupo.map(g=>`<tr><td colspan="9" style="background:#f6f8fb"><b>Pedido ${g.n}</b> <span class="viejo">· ${fecha(g.f)}</span>${g!==p?` <button class="b l" data-quitarj="${g.n}">quitar de esta factura</button>`:''}</td></tr>`+g.l.map((l,i)=>{
  const fc=num(g.fac[i].c),fp=num(g.fac[i].pr),imp=fc!=null&&fp!=null?fc*fp:null;if(imp!=null)sumF+=imp;
  const rc=g.rec[i],dv=g.dev[i];if(dv>0){nDev++;abono+=dv*(fp??l.pr)}if(rc<l.c||dv>0)pend++;
  const dRec=rc!==l.c,dC=fc!=null&&fc!==rc,dP=fp!=null&&Math.abs(fp-l.pr)>0.004;if(dRec||dC||dP)dif++;if(fc==null||fp==null)falta++;
  const est=fc==null||fp==null?'<span class="viejo">falta la factura</span>':(dRec||dC||dP)?`<span style="color:#b42318">${[dRec?`recibido ${rc} de ${l.c}`:'',dC?`facturado ${fc}, recibido ${rc}`:'',dP?`precio ${eur(fp)} en vez de ${eur(l.pr)}`:''].filter(Boolean).join(' · ')}</span>`:'<span style="color:#17663a">✓ cuadra</span>';
  const k=`${g.n}|${i}`;
  return `<tr><td>${esc(nom(l.a))}${l.para?`<br><small class="viejo">para ${esc(l.para)}</small>`:''}</td><td class="n">${l.c} × ${eur(l.pr)}<br><small>${eur(l.c*l.pr)}</small></td>
  <td class="n ${dRec?'difer':''}"><input type="number" min="0" value="${rc}" data-rec="${k}" style="width:60px"></td>

 const comprobar=(X,esperado,quien)=>{const base=num(X.base),iva=num(X.iva),tot=num(X.tot),c=[];

  if(base!=null&&iva!=null)c.push(Math.abs(base*0.21-iva)<0.01?'<span style="color:#17663a">✓ IVA al 21 %.</span>':`<span style="color:#b42318">El IVA no es el 21 % de la base (sería ${eur(base*0.21)}).</span>`);
  if(base!=null&&iva!=null&&tot!=null)c.push(Math.abs(base+iva-tot)<0.01?'<span style="color:#17663a">✓ Base más IVA da el total.</span>':`<span style="color:#b42318">Base más IVA da ${eur(base+iva)}, no ${eur(tot)}.</span>`);

 const campos=(X,nm)=>`<div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:end">

  document.getElementById('ok').onclick=()=>{const v=ins.map((e,i)=>{const x=valorDe(e);return x&&e.value==='__nuevo'?(igualA(c.vals[c.car[i]],x)||x):x});

   const id='a'+(arts.length+1)+'x';arts.push({id,cat:cId,v,u});cerrar();aviso('Artículo nuevo: '+nom(id));alGuardar(id)};

 const anual=z=>{const ya=gasto[z.p]+pendDe(z.p),tras=ya+z.t;return `<br><small class="${tras>=TOPE?'':'viejo'}" style="${tras>=TOPE?'color:#b42318;font-weight:600':tras>=TOPE*0.8?'color:#9a5b00':''}">este año: ${eur(tras)} de ${eur(TOPE)}${tras>=TOPE?' · se pasa del tope':tras>=TOPE*0.8?' · cerca del tope':''}</small>`};

  <table><thead><tr><th>Artículo</th><th class="n">Cantidad</th>${usados.map(p=>`<th class="prov n">${esc(provs[p].split(',')[0])}</th>`).join('')}<th class="prov n"><button class="b l" id="otro">+ Otro proveedor</button></th></tr></thead><tbody>
  ${lin.map(x=>{const zs=usados.map(p=>ult(x.a,p)),vals=zs.filter(z=>z&&meses(z.f)<=6).map(z=>z.pr),mn=Math.min(...vals);
   return `<tr><td>${esc(nom(x.a))}${asig[x.id]==null?'<br><small style="color:#9a5b00">sin asignar: se queda en «Lo que falta»</small>':''}</td><td class="n" style="white-space:nowrap"><input type="number" min="1" value="${x.c}" data-q="${x.id}" style="width:60px"> × ${esc(artDe(x.a).u)}</td>${zs.map((z,i)=>{const p=usados[i],el=asig[x.id]===p;

  <tr><td colspan="2"><b>Lo asignado, sin IVA</b></td>${tot.map(z=>`<td class="n"><b>${z.n?eur(z.t):'—'}</b>${z.n?`<br><small>${z.n} línea${z.n>1?'s':''} · con IVA ${eur(z.t*1.21)}</small>`:''}${portes(z)}${anual(z)}</td>`).join('')}<td></td></tr></tbody></table>`;
 cuadro(`Pedir ${lin.length} artículo${lin.length>1?'s':''}`,cuerpo,`<span class="ayuda" style="margin:0 auto 0 0">Cada proveedor con líneas asignadas tendrá su asunto COMPRA con su documento de pedido.${sinAsig?` ${sinAsig} sin asignar se quedan en «Lo que falta».`:''}</span><button class="b" id="x">Cancelar</button><button class="b p" id="ok" ${nPed?'':'disabled'}>${nPed>1?`Hacer ${nPed} pedidos`:nPed?`Pedir a ${esc(provs[tot.find(z=>z.n).p].split(',')[0])}`:'Pedir'}</button>`);
 const vuelve=()=>cuadroPedir();
 capa.querySelectorAll('[data-q]').forEach(inp=>inp.onchange=()=>{const x=falta.find(z=>z.id===+inp.dataset.q),n=Math.max(1,Math.floor(+inp.value||1));
  if(n<x.c){const resto={id:sigF++,a:x.a,c:x.c-n,q:x.q,f:x.f,para:x.para};x.c=n;falta.splice(falta.indexOf(x)+1,0,resto);(cuadroPedir.partidas=cuadroPedir.partidas||[]).push([x.id,resto.id]);marc.add(resto.id);aviso(`Partida: ${n} aquí y ${resto.c} en la fila de debajo, sin asignar.`)}else x.c=n;
  cuadroPedir()});
 capa.querySelectorAll('.celda').forEach(td=>td.onclick=e=>{const l=+td.dataset.l,p=+td.dataset.p,a=td.dataset.a;
  if(e.target.dataset.cambiar){cuadroPrecio(a,p,vuelve);return}
  if(!ult(a,p)){cuadroPrecio(a,p,()=>{if(ult(a,p))asig[l]=p;cuadroPedir()});return}
  asig[l]=p;cuadroPedir()});
 capa.querySelectorAll('[data-portes]').forEach(bt=>bt.onclick=()=>{const p=+bt.dataset.portes;
  cuadro('Portes gratis',`<p class="ayuda" style="margin-top:0">${esc(provs[p])}</p><div class="fila"><label>Portes gratis desde</label><input type="number" step="0.01" min="0" id="pg" value="${portesDe[p]??''}" style="width:120px"></div><p class="ayuda">Importe sin IVA. Vacío si no tiene. Queda apuntado en el proveedor.</p>`,`<button class="b" id="x2">Cancelar</button><button class="b p" id="ok2">Guardar</button>`,true);
  document.getElementById('x2').onclick=vuelve;document.getElementById('ok2').onclick=()=>{const v=parseFloat(document.getElementById('pg').value);if(v>0)portesDe[p]=v;else delete portesDe[p];cuadroPedir()}});
 document.getElementById('otro').onclick=()=>{
   cuadro('Otro proveedor',`<div class="fila"><label>Proveedor</label>${provSelect('op')}</div><p class="ayuda">Sale como una columna más, sin precios; pulsa sus casillas para escribirlos.</p>`,`<button class="b" id="x2">Cancelar</button><button class="b p" id="ok2">Añadir</button>`,true);
   const op=document.getElementById('op');op.onchange=()=>{if(op.value==='nuevo'){aviso('En la app se abre aquí el alta de empresa de «Personas y empresas».');op.value='0'}};
   document.getElementById('x2').onclick=vuelve;document.getElementById('ok2').onclick=()=>{cuadroPedir.extra.push(+op.value);cuadroPedir()}};
 const limpiar=()=>{cuadroPedir.extra=[];cuadroPedir.asig=null;cuadroPedir.partidas=[]};
 document.getElementById('x').onclick=()=>{(cuadroPedir.partidas||[]).reverse().forEach(([o,r])=>{const a=falta.find(z=>z.id===o),b=falta.find(z=>z.id===r);if(a&&b){a.c+=b.c;falta=falta.filter(z=>z!==b);marc.delete(r)}});limpiar();cerrar();pintar()};
 document.getElementById('ok').onclick=()=>{const hechos=[];
  tot.filter(z=>z.n).forEach(z=>{const l=lin.filter(x=>asig[x.id]===z.p).map(x=>({a:x.a,c:x.c,pr:ult(x.a,z.p).pr,para:x.para}));
   const n='A26-0'+(sigN++);pedidos.push({n,p:z.p,f:HOY,l,doc:'261125 PEDIDO D26-00'+(sigD++)+'.pdf'});hechos.push(n)});
  falta=falta.filter(x=>!(marc.has(x.id)&&asig[x.id]!=null));marc.clear();limpiar();cerrar();vista='pedidos';pintar();
  aviso(hechos.length>1?`${hechos.length} asuntos COMPRA nuevos: ${hechos.join(' y ')}, cada uno con su documento de pedido.`:`Asunto nuevo ${hechos[0]} COMPRA, con su documento de pedido.`)};
}
/* ---- apuntar ---- */
let sugAct=0,elegidoArt=null,paraSel='Administración';
function sugerir(){const q=document.getElementById('busca').value.trim().toLowerCase(),s=document.getElementById('sug');
 elegidoArt=null;document.getElementById('apuntar').disabled=true;
 if(!q){s.hidden=true;return}
 const pal=q.split(/\s+/),r=arts.filter(a=>{const t=(nom(a.id)+' '+a.u).toLowerCase();return pal.every(p=>t.includes(p))});
 s.innerHTML=r.map((a,i)=>`<div data-s="${a.id}" class="${i===sugAct?'act':''}">${esc(nom(a.id))} <span class="viejo">· ${esc(a.u)}</span></div>`).join('')+`<div class="nuevo" data-s="nuevo">+ Nuevo artículo…</div>`;s.hidden=false}
function elegir(id){const s=document.getElementById('sug');s.hidden=true;
 if(id==='nuevo'){cuadroArticulo(document.getElementById('busca').value.trim(),nid=>{pintar();ponerBusca(nid)});return}
 ponerBusca(id)}
function ponerBusca(id){const b=document.getElementById('busca');b.value=nom(id);elegidoArt=id;document.getElementById('apuntar').disabled=false;const c=document.getElementById('cant');c.focus();c.select()}
function apuntar(){if(!elegidoArt)return;const c=Math.max(1,+document.getElementById('cant').value||1);paraSel=document.getElementById('para').value;
 const ya=falta.find(x=>x.a===elegidoArt&&x.para===paraSel);
 if(ya){ya.c+=c;aviso(`Ya estaba apuntado para ${paraSel}: ahora ${ya.c} × ${artDe(elegidoArt).u}.`)}else{falta.push({id:sigF++,a:elegidoArt,c,q:YO,f:HOY,para:paraSel});aviso('Apuntado.')}
 elegidoArt=null;pintar();document.getElementById('busca').focus()}
/* ---- eventos ---- */
main.addEventListener('click',e=>{const t=e.target.closest('button,[data-cat],[data-art],[data-s],input[type=checkbox]');if(!t)return;
 if(t.dataset.v){vista=t.dataset.v;pintar()}
 else if(t.dataset.s)elegir(t.dataset.s)
 else if(t.id==='apuntar')apuntar()
 else if(t.id==='pedir'){cuadroPedir.asig=null;cuadroPedir.extra=[];cuadroPedir.partidas=[];cuadroPedir()}
 else if(t.id==='presu')cuadroPresu()
 else if(t.dataset.portes2!=null){const p=+t.dataset.portes2;cuadro('Portes gratis',`<p class="ayuda" style="margin-top:0">${esc(provs[p])}</p><div class="fila"><label>Portes gratis desde</label><input type="number" step="0.01" min="0" id="pg" value="${portesDe[p]??''}" style="width:120px"></div><p class="ayuda">Importe sin IVA. Vacío si no tiene.</p>`,`<button class="b" id="x2">Cancelar</button><button class="b p" id="ok2">Guardar</button>`,true);
  document.getElementById('x2').onclick=cerrar;document.getElementById('ok2').onclick=()=>{const v=parseFloat(document.getElementById('pg').value);if(v>0)portesDe[p]=v;else delete portesDe[p];cerrar();pintar()}}
 else if(t.id==='quitar'){const n=marc.size;falta=falta.filter(x=>!marc.has(x.id));marc.clear();pintar();aviso(`Quitado${n>1?'s':''} ${n} de la lista.`)}
 else if(t.id==='todas'){marc=t.checked?new Set(falta.map(x=>x.id)):new Set();pintar()}
 else if(t.dataset.m){const id=+t.dataset.m;t.checked?marc.add(id):marc.delete(id);pintar()}
 else if(t.dataset.cat){catSel=t.dataset.cat;artSel=null;pintar()}
 else if(t.dataset.art){artSel=t.dataset.art;pintar()}
 else if(t.id==='ncat')cuadroCategoria(false)
 else if(t.id==='ccar')cuadroCategoria(true)
 else if(t.id==='nart')cuadroArticulo('',id=>{artSel=id;catSel=artDe(id).cat;pintar()},true)
 else if(t.id==='nprecio')cuadroPrecio(artSel,null)
 else if(t.dataset.doc)aviso('En la app se abre el documento, dentro de su asunto.')
 else if(t.dataset.abrir){pedSel=t.dataset.abrir;vista='asunto';pintar()}
 else if(t.id==='volver'){vista='pedidos';pintar()}
 else if(t.id==='devolver'){const p=pedidos.find(z=>z.n===pedSel);let n=0;[p,...p.junto.map(x=>pedidos.find(z=>z.n===x))].forEach(g=>g.l.forEach((l,i)=>{const r=l.c-g.rec[i]+g.dev[i];if(r>0){falta.push({id:sigF++,a:l.a,c:r,q:YO,f:HOY,para:l.para});n++}}));p.devuelto=true;pintar();aviso(`${n} línea${n>1?'s':''} de vuelta en «Lo que falta».`)}
 else if(t.dataset.quitarj){const p=pedidos.find(z=>z.n===pedSel);p.junto=p.junto.filter(x=>x!==t.dataset.quitarj);pintar()}
 else if(t.id==='preciosfra'){const p=pedidos.find(z=>z.n===pedSel);[p,...p.junto.map(x=>pedidos.find(z=>z.n===x))].forEach(g=>g.l.forEach((l,i)=>{const pr=+g.fac[i].pr;precios=precios.filter(z=>!(z.a===l.a&&z.p===p.p&&z.f===p.fra.f));precios.push({a:l.a,p:p.p,pr,f:p.fra.f,o:'Factura '+(p.fra.num||'')})}));aviso('Precios de la factura pasados al catálogo, con su fecha.')}
});
main.addEventListener('focusout',e=>{const d=e.target.dataset;if((d.fra||d.rect)&&vista==='asunto'){const p=pedidos.find(z=>z.n===pedSel),X=d.fra?p.fra:p.rec2,k=d.fra||d.rect;const sig=e.relatedTarget&&e.relatedTarget.dataset;if(X[k]!==e.target.value){X[k]=e.target.value;X._sucio=true}if(X._sucio&&!(sig&&(sig.fra||sig.rect))){X._sucio=false;setTimeout(pintar,0)}}});
main.addEventListener('input',e=>{if(e.target.id==='busca'){sugAct=0;sugerir()}});
main.addEventListener('change',e=>{const d=e.target.dataset;
 const gl=k=>{const [n,i]=k.split('|');return [pedidos.find(z=>z.n===n),+i]};
 if(d.rec!=null){const [g,i]=gl(d.rec);g.rec[i]=Math.max(0,+e.target.value||0);pintar();return}
 if(d.dev!=null){const [g,i]=gl(d.dev);g.dev[i]=Math.max(0,+e.target.value||0);pintar();return}
 if(d.fc!=null){const [g,i]=gl(d.fc);g.fac[i].c=e.target.value;pintar();return}
 if(d.fp!=null){const [g,i]=gl(d.fp);g.fac[i].pr=e.target.value;pintar();return}
 if(e.target.id==='para'&&e.target.value==='__nuevo'){cuadro('Nuevo destino',`<div class="fila"><label>Para quién</label><input type="text" id="nd" placeholder="Dpto. de Inglés, Orientación…"></div>`,`<button class="b" id="x2">Cancelar</button><button class="b p" id="ok2">Añadir</button>`,true);
  document.getElementById('x2').onclick=()=>{cerrar();e.target.value=paraSel};document.getElementById('ok2').onclick=()=>{const v=document.getElementById('nd').value.trim();if(!v){aviso('Escribe el nombre.');return}const ya=destinos.find(d=>d.toLowerCase()===v.toLowerCase());if(!ya)destinos.push(v);paraSel=ya||v;const b=document.getElementById('busca').value,ea=elegidoArt;cerrar();pintar();if(ea){ponerBusca(ea)}else document.getElementById('busca').value=b};return}
 if(e.target.id==='juntar'&&e.target.value){const p=pedidos.find(z=>z.n===pedSel);p.junto.push(e.target.value);pintar();return}
 if(d.fra||d.rect)return;
 if(e.target.dataset.c){const x=falta.find(z=>z.id===+e.target.dataset.c);x.c=Math.max(1,+e.target.value||1);pintar()}});
main.addEventListener('keydown',e=>{if(e.target.id==='busca'){const s=document.getElementById('sug'),it=[...s.querySelectorAll('[data-s]')];
  if(e.key==='ArrowDown'&&!s.hidden){sugAct=Math.min(sugAct+1,it.length-1);it.forEach((d,i)=>d.classList.toggle('act',i===sugAct));e.preventDefault()}
  else if(e.key==='ArrowUp'&&!s.hidden){sugAct=Math.max(sugAct-1,0);it.forEach((d,i)=>d.classList.toggle('act',i===sugAct));e.preventDefault()}
  else if(e.key==='Enter'&&!s.hidden&&it[sugAct]){elegir(it[sugAct].dataset.s);e.preventDefault()}}
 else if(e.target.id==='cant'&&e.key==='Enter')apuntar()});
pintar();
}
</script>
</body>
</html>

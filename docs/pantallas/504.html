<title>Filas devueltas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --ground:#f2f4f2; --panel:#ffffff; --ink:#1b2621; --muted:#5d6b64; --line:#d9e0dc;
  --accent:#0b6b3a; --accent-soft:#e3f1e8;
  --ok:#1f7a45; --ok-soft:#e2f3e8; --warn:#9a5b00; --warn-soft:#fdf0d9; --bad:#b3261e; --bad-soft:#fbe4e2;
  --sans:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#121815; --panel:#1a221e; --ink:#e4ebe7; --muted:#9aa8a1; --line:#2c3732;
    --accent:#5cc28a; --accent-soft:#1d3327;
    --ok:#6fd198; --ok-soft:#1b3326; --warn:#f0b35a; --warn-soft:#3a2c14; --bad:#f28b82; --bad-soft:#3d1f1d;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#121815; --panel:#1a221e; --ink:#e4ebe7; --muted:#9aa8a1; --line:#2c3732;
  --accent:#5cc28a; --accent-soft:#1d3327;
  --ok:#6fd198; --ok-soft:#1b3326; --warn:#f0b35a; --warn-soft:#3a2c14; --bad:#f28b82; --bad-soft:#3d1f1d;
}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45}
.wrap{padding-inline:16px;padding-block:12px 20px;display:flex;flex-direction:column;gap:12px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
h1{font-size:21px;margin:0;text-wrap:balance}
.meta{color:var(--muted);font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
a.abre{display:inline-block;font:inherit;font-size:13px;font-weight:700;text-decoration:none;border:1px solid var(--accent);background:var(--accent);color:var(--panel);border-radius:6px;padding:5px 10px;cursor:pointer}
a.abre.grande{font-size:14px;padding:6px 14px}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* Dos columnas */
.app{display:block}
/* Versión 66: sin panel izquierdo; dentro de una app, «← Tus apps» y un desplegable para saltar a otra */
aside,select#movil{display:none!important}
.navapp{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
/* El botón «Abrir Claude Code» va dentro del recuadro de estado: no hereda el color del título grande */
.estado a.abre,.estado a.abre.grande{color:var(--panel);font-size:14px}
.navapp select{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);max-width:100%}
aside{position:sticky;top:env(safe-area-inset-top,0px);max-height:calc(100vh - 70px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:2px}
.grupo{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 8px 2px}
details.reposo>summary{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 8px 2px;cursor:pointer;list-style-position:inside}
.item{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:4px 8px;text-align:left;width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 8px}
.item:hover{border-color:var(--line)}
.item[aria-current="true"]{background:var(--accent-soft);border-color:var(--accent)}
.item .nom{font-weight:700;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .cnt{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .dsc{grid-column:2 / 4;font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.punto{width:10px;height:10px;border-radius:50%;background:var(--line)}
.punto.ok{background:var(--ok)} .punto.warn{background:var(--warn)} .punto.bad{background:var(--bad)} .punto.info{background:var(--muted)}
.item .webmal{color:var(--bad);font-weight:700}
select#movil{display:none;font:inherit;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:100%}

main{display:flex;flex-direction:column;gap:10px;min-width:0}
.cab{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.cab h2{font-size:20px;margin:0}
.cab h2.nom-edit{border:1px solid transparent;border-radius:6px;padding:1px 6px;margin-left:-7px;cursor:text;outline:none}
.cab h2.nom-edit:hover{border-color:var(--line);background:var(--panel)}
.cab h2.nom-edit:focus{border-color:var(--accent);background:var(--panel)}
.cab .gh{font-size:13px}
.chip{font-size:13px;border-radius:999px;padding:2px 10px;background:var(--panel);border:1px solid var(--line)}
.chip.ok{color:var(--ok)} .chip.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent} .chip.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent} .chip.info{color:var(--muted)}
.lanzar{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn-lanzar{background:var(--accent);color:var(--panel);border-color:var(--accent);font-weight:700;font-size:14px;padding:6px 14px}
.btn-lanzar.sec{background:transparent;color:var(--muted);border-color:var(--line);font-weight:400;font-size:12px;padding:3px 8px}
.btn-lanzar:disabled{background:var(--panel);color:var(--muted);border-color:var(--line);cursor:default;font-weight:400}
.nota{font-size:13px;color:var(--muted)} .nota.bad{color:var(--bad)}
.frase{font:inherit;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:min(340px,100%);min-width:0;text-overflow:ellipsis}

.estado{border-radius:8px;padding:10px 14px;border:1px solid var(--line);background:var(--panel);display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.estado .grande{font-size:18px;font-weight:700}
.estado .sub{color:var(--ink);font-size:14px}
.estado.ok{background:var(--ok-soft);border-color:transparent} .estado.ok .grande{color:var(--ok)}
.estado.warn{background:var(--warn-soft);border-color:transparent} .estado.warn .grande{color:var(--warn)}
.estado.bad{background:var(--bad-soft);border-color:transparent} .estado.bad .grande{color:var(--bad)}
.estado.info .grande{color:var(--accent)}
.enlaces{display:flex;flex-wrap:wrap;gap:4px 14px;width:100%}
.enlaces a{font-weight:700}
.estado .guardar{background:var(--accent);color:var(--panel);border-color:var(--accent);font-weight:700}
.avisos{display:flex;flex-direction:column;gap:6px}
.aviso{border-left:4px solid var(--warn);background:var(--warn-soft);padding:6px 12px;border-radius:0 6px 6px 0;font-size:14px}
.aviso.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.cuentas{display:flex;flex-wrap:wrap;gap:6px}
.cuenta{display:flex;align-items:baseline;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px}
button.cuenta{cursor:pointer;font-size:13px} button.cuenta[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.cuenta b{font-family:var(--mono);font-variant-numeric:tabular-nums}

.pestanas{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.pestanas button{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;font-size:14px;padding:6px 12px;color:var(--muted)}
.pestanas button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;align-items:start}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
section h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0;display:flex;justify-content:space-between;gap:8px}
ol,ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
li{display:grid;grid-template-columns:3.2em 1fr;gap:8px;padding:5px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
ol.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));column-gap:24px}
ol.cols li:nth-child(-n+2){border-top:0}
.n{font-family:var(--mono);font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.t{min-width:0;overflow-wrap:anywhere}
.sub{display:block;color:var(--muted);font-size:13px}
.vacio{color:var(--muted);font-style:italic;padding:2px 0}
.commit{grid-template-columns:4.2em 1fr}
.hora{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.fallo{color:var(--bad);font-size:14px}
.fila-p{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.fila-p:first-child{border-top:0}
.fila-p .nom{font-weight:700}
.fila-p .sub{grid-column:2 / 4}
.pie{color:var(--muted);font-size:12px;margin:0}
li.mov{grid-template-columns:3.2em 1fr auto}
.flechas{display:flex;gap:4px;align-self:start}
.flechas button{padding:2px 8px;font-size:14px;line-height:1.2}
.flechas button:disabled{opacity:.35;cursor:default}
li.movido .n{color:var(--warn)}
.barra-orden{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--warn-soft);border-radius:6px;padding:8px 12px;font-size:14px}
.acciones-idea{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center;font-size:13px}
.acciones-idea select{font:inherit;font-size:13px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.acciones-idea .guardar{background:var(--accent);color:var(--panel);border-color:var(--accent);font-weight:700}
.resumen{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.resumen .qui{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.resumen .txt{font-size:15px;white-space:pre-line}
.resumen .txt.pensando{color:var(--muted);font-style:italic}
.recortes{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.recorte{border:1px solid var(--line);border-radius:6px;padding:0;background:var(--panel);cursor:zoom-in;line-height:0;max-width:100%}
.recorte img{display:block;height:72px;width:auto;max-width:220px;object-fit:cover;border-radius:5px}
.recorte.grande{cursor:zoom-out;flex-basis:100%}
.recorte.grande img{height:auto;max-width:100%;max-height:none}
.borrador-img{display:flex;align-items:center;gap:6px;width:100%;flex-wrap:wrap}
.borrador-img img{height:56px;border-radius:5px;border:1px solid var(--line)}
/* Versión 70: archivos adjuntos (PDF, Word, Excel, texto) en las ideas */
a.archivo,span.archivo{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:5px 10px;background:var(--panel);color:var(--ink);font-size:13px;text-decoration:none;max-width:100%;overflow-wrap:anywhere}
a.archivo:hover{border-color:var(--accent)}
.aviso-texto.plegado{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.aviso-texto.desplegable{cursor:pointer}
.t a.tit-diseno{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.t a.tit-diseno:hover{text-decoration-color:var(--accent)}
.aviso-texto{margin-top:4px;padding:6px 10px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0;white-space:pre-line;font-size:14px;color:var(--ink)}
.barra-orden .guardar{background:var(--accent);color:var(--panel);border-color:var(--accent);font-weight:700}
.idea-texto{width:100%;box-sizing:border-box;font:inherit;font-size:15px;line-height:1.55;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);min-height:7.5em;resize:vertical;overflow-y:auto}
.idea-texto:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.idea-pie{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;width:100%}
.idea-pie .borrador-img{flex:1;width:auto;min-width:200px}
.idea-pie .palabras{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
/* Nota de Francisco en un aviso de soporte, y motivo cuando la captura no se puede traer */
.nota-fr{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.nota-fr label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.nota-fr .idea-texto{min-height:3.4em;font-size:14px;line-height:1.45}
.nota-fr .pie-nota{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.nota-fr .guardar{background:var(--accent);color:var(--panel);border-color:var(--accent);font-weight:700}
.cap-fallo{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:4px;font-size:13px;color:var(--muted)}
.cap-fallo button{padding:2px 8px}
/* Editar una idea propia que sigue sin diseñar: la misma caja grande de «Nueva idea» */
.edita-idea{display:flex;flex-direction:column;gap:6px;min-width:0}
.edita-idea label{font-weight:700}
.edita-idea .guardar{background:var(--accent);color:var(--panel);border-color:var(--accent);font-weight:700}
.edita-idea .guardar:disabled{background:var(--panel);color:var(--muted);border-color:var(--line);cursor:default;font-weight:400}
.edita-idea .nota{width:100%}
.edita-idea .idea-pie .borrador-img{flex:1 1 100%}
.edita-idea .idea-pie .palabras{margin-left:auto}
/* Mientras se edita una idea, su lista se queda con dos tercios del ancho */
@media (min-width:1000px){ .grid.editando{grid-template-columns:minmax(0,1fr) minmax(0,2fr)} }

/* Enlace a la app, avisos de copias y panel general */
a.abre.hueca{background:transparent;color:var(--accent)}
a.abre.mini{font-size:12px;font-weight:400;padding:3px 8px;background:transparent;color:var(--muted);border-color:var(--line)}
.lanzar .nota.ancha{width:100%}
.cab .tambien{font-size:12px;color:var(--muted)}
.aviso.info{border-left-color:var(--muted);background:var(--panel);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.tabla-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
table.panel{border-collapse:collapse;width:100%;font-size:14px}
table.panel th,table.panel td{padding:6px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top;font-weight:400}
table.panel thead th{border-top:0;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);vertical-align:bottom}
table.panel .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
table.panel thead th.num{font-family:var(--sans)}
table.panel tr.total th,table.panel tr.total td{background:var(--accent-soft);font-weight:700}
/* Versión 67: la tabla de entrada se desplaza por dentro; la cabecera arriba y la fila «Todas» abajo siempre a la vista */
.tabla-wrap.panelw{max-height:calc(100vh - 120px);overflow:auto}
.tabla-wrap.panelw thead th{position:sticky;background:var(--panel);z-index:2}
.tabla-wrap.panelw thead tr.grupos th{top:0}
.tabla-wrap.panelw thead tr:not(.grupos) th{top:var(--alto-grupos,30px);box-shadow:inset 0 -1px 0 var(--line)}
.tabla-wrap.panelw tfoot tr.total th,.tabla-wrap.panelw tfoot tr.total td{position:sticky;bottom:0;z-index:2;box-shadow:inset 0 1px 0 var(--line)}
table.panel thead th.ordena{cursor:pointer;user-select:none}
table.panel thead th.ordena:hover{color:var(--ink)}
table.panel thead th.ordena[aria-sort]:not([aria-sort="none"]){color:var(--ink);font-weight:700}
table.panel tr.reposo th button.lnk{color:var(--muted)}
table.panel th[scope="row"]{min-width:150px}
table.panel td.est{min-width:170px}
table.panel td:last-child,table.panel th:last-child{white-space:nowrap}
table.panel td.apl{min-width:190px;overflow-wrap:anywhere}
table.panel .est .punto{display:inline-block;margin-right:6px}
button.lnk{border:0;background:none;padding:0;text-align:left;border-radius:2px;color:var(--accent);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
button.lnk[aria-pressed="true"]{background:var(--accent);color:var(--panel);text-decoration:none;padding:0 6px}
.cero{color:var(--muted)}
table.panel.suelta td:last-child,table.panel.suelta th:last-child{white-space:normal;min-width:240px}
table.panel td.cod{font-family:var(--mono);font-weight:600;color:var(--accent);white-space:nowrap}
.dos-tablas{display:flex;flex-direction:column;gap:12px;min-width:0}
.sop-ok{color:var(--ok);font-weight:700} .sop-warn{color:var(--warn);font-weight:700} .sop-info{color:var(--muted)}

/* Te toca a ti: pasos que solo puede dar Francisco */
.pestanas button.con:not([aria-selected="true"]){color:var(--warn);font-weight:700}
.grid.toca{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.grid.tocas{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.caja-toca{display:flex;flex-direction:column;gap:6px;min-width:0}
li.paso{grid-template-columns:3.2em minmax(0,1fr) auto;align-items:start}
li.paso>button{white-space:nowrap}
li.paso .guardar{background:var(--accent);color:var(--panel);border-color:var(--accent);font-weight:700}
li.paso.hecho .txt{color:var(--muted);text-decoration:line-through}
li.paso code{font-family:var(--mono);font-size:13px;background:var(--ground);border-radius:4px;padding:0 4px;overflow-wrap:anywhere}
/* Hecho por ti (9-oct-2026): cada paso en un renglón; «Ampliar» lo enseña entero, con su botón «Deshacer» */
li.paso.corto{align-items:baseline;padding:3px 0}
li.paso.corto .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
li.paso.corto .sub{display:none}
li.paso .conv{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:4px}
li.paso .conv input{font:inherit;font-size:13px;flex:1 1 260px;min-width:0;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
li.paso .conv .nota{width:100%}
li.paso .conv button{padding:3px 8px;font-size:12px}
li.paso .conv a.abre.mini.seguir{background:var(--accent);color:var(--panel);border-color:var(--accent);font-weight:700}
li.paso button.mas{border:0;background:none;padding:0;color:var(--accent);font-size:13px;text-decoration:underline;border-radius:2px}
li.paso .t button.mas{display:block;margin-top:2px}
.duda{color:var(--warn);font-weight:700}
/* Proyecto de Claude de cada app: una línea en «Ideas y diseño» */
.barra-orden.proy{background:var(--panel);border:1px solid var(--line)}
.barra-orden.proy input{flex:1;min-width:220px;font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.barra-orden.proy .guardar{background:var(--accent);color:var(--panel);border-color:var(--accent);font-weight:700}
.barra-orden.proy .ok{color:var(--ok);font-weight:700}
section h3 button.lnk{text-transform:none;letter-spacing:0;font-size:14px}

/* Versión 65: mapa de la app, reflexión, números que piden algo, tabla de entrada por bloques */
.mapa{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 20px}
.mapa .bloque{display:flex;flex-direction:column;gap:2px;min-width:0}
.mapa h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mapa p{margin:0;font-size:14px}
.mapa ul{list-style:disc;padding-left:18px;display:block}
.mapa ul li{display:list-item;border:0;padding:1px 0;font-size:14px}
li.marcable{grid-template-columns:5em 1fr}
li.fuera .t{color:var(--muted)}
label.casilla{display:flex;align-items:flex-start;gap:6px;cursor:pointer}
label.casilla input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--accent);cursor:pointer}
a.abre[aria-disabled="true"]{background:var(--panel);color:var(--muted);border-color:var(--line);font-weight:400;cursor:default}
.reflex{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.resalta{background:var(--warn-soft);color:var(--warn)!important;border-radius:4px;padding:0 6px}
button.lnk.resalta{text-decoration:none;padding:0 6px}
button.cuenta.alerta:not([aria-pressed="true"]){border-color:var(--warn);color:var(--warn);font-weight:700}
table.panel thead tr.grupos th{text-align:center;color:var(--ink);font-weight:700;border-bottom:1px solid var(--line)}
table.panel .sep{border-left:2px solid var(--line)}
table.panel thead th.num{white-space:normal;min-width:72px}
.tema-ideas{margin-top:4px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:1px}
.tipo{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--warn)}

@media (max-width:760px){
  .grid.toca,.grid.tocas{grid-template-columns:1fr}
  li.paso{grid-template-columns:3.2em minmax(0,1fr)}
  li.paso>button{grid-column:2;justify-self:start}
  li.paso.corto{grid-template-columns:3.2em minmax(0,1fr) auto}
  li.paso.corto>button{grid-column:auto}
  .app{grid-template-columns:1fr}
  aside{display:none}
  select#movil{display:block}
  ol.cols{grid-template-columns:1fr}
  ol.cols li:nth-child(2){border-top:1px solid var(--line)}
  .lanzar{margin-left:0}
}
/* Versión 75: vista «Tiempo por app» */
.tiempo,.tiempo *{box-sizing:border-box}
.tiempo{display:flex;flex-direction:column;gap:10px;min-width:0}
.t-periodo{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
.t-grupo{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.t-chip{font-size:13px;padding:3px 9px}
.t-chip[aria-pressed="true"]{background:var(--accent);color:var(--panel);border-color:var(--accent);font-weight:700}
.t-sel{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.t-sel select{font:inherit;font-size:13px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.t-lista{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px 14px}
.t-fila{display:grid;grid-template-columns:2em minmax(130px,190px) minmax(0,1fr) 4.5em minmax(170px,1fr) auto;gap:4px 12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.t-fila:first-child{border-top:0}
.t-fila.t-cab{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:7px 0}
.t-pos{font-family:var(--mono);font-weight:600;color:var(--accent)}
.t-nom{font-weight:700;min-width:0;overflow-wrap:anywhere}
.t-barra{height:12px;background:var(--line);border-radius:3px;overflow:hidden;min-width:40px}
.t-barra i{display:block;height:100%;background:var(--accent)}
.t-fila.mal .t-barra i{background:var(--warn)}
.t-horas{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.t-aviso{font-size:14px;min-width:0}
.t-aviso span{display:inline-block;max-width:100%;border-radius:6px;padding:1px 8px;background:var(--warn-soft);color:var(--warn);margin:1px 4px 1px 0}
.t-aviso span.olvido{background:var(--bad-soft);color:var(--bad)}
.t-aviso span.t-carga{background:transparent;color:var(--muted);padding-left:0}
.t-fila .flechas{align-self:center}
@media (max-width:760px){
  .t-fila.t-cab{display:none}
  .t-fila{grid-template-columns:2em minmax(0,1fr) auto}
  .t-barra{grid-column:2}
  .t-horas{grid-column:3;grid-row:2}
  .t-aviso{grid-column:2 / 4}
  .t-aviso:empty{display:none}
  .t-fila .flechas{grid-column:3;grid-row:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.prueba{background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px;padding:6px 12px;font-size:14px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.prueba button{background:var(--panel)}
.texto-dev{display:inline-block;width:4.5ch;margin-left:.5ch;text-align:left;color:var(--bad);font-weight:700}
.t .chip{display:inline-block;font-size:12px;font-weight:700;padding:0 8px;margin-right:6px}

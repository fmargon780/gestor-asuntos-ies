  run:(s,v,p)=>{const o=otro(s.campo,p);if(!o)return v;if(!v)return o;return s.lado==='final'?v+s.sep+o:o+s.sep+v}},
 texto:{n:'Añadir un texto fijo',d:{txt:'',lado:'principio'},run:(s,v)=>!v?v:(s.lado==='principio'?s.txt+v:v+s.txt)},
 si:{n:'Si… entonces… si no…',d:{campo:'',cond:'igual',val:'',ent:'',sino:''},
  run:(s,v,p)=>{const o=s.campo?otro(s.campo,p):v,a=String(o).toLowerCase(),b=String(s.val).toLowerCase();
   const ok={igual:a===b,distinto:a!==b,contiene:b!==''&&a.includes(b),empieza:b!==''&&a.startsWith(b),vacio:!a,lleno:!!a}[s.cond];
   const r=ok?s.ent:s.sino;return r===''?v:r}},
 vacio:{n:'Si está vacío, usar otro campo',d:{campo:''},run:(s,v,p)=>v||otro(s.campo,p)},
 equiv:{n:'Tabla de equivalencias',d:{filas:[{de:'',a:''}]},run:(s,v)=>{const f=s.filas.find(x=>x.de!==''&&x.de.toLowerCase()===String(v).toLowerCase());return f?f.a:v}},
 quitarFin:{n:'Quitar los últimos caracteres',d:{n:1},run:(s,v)=>String(v).slice(0,Math.max(0,String(v).length-(+s.n||0))).trim()},
 quitarIni:{n:'Quitar los primeros caracteres',d:{n:1},run:(s,v)=>String(v).slice(+s.n||0).trim()},
 partir:{n:'Partir por un signo',d:{signo:' ',parte:'1'},run:(s,v)=>{if(!s.signo)return v;const t=String(v).split(s.signo);return (s.parte==='u'?t[t.length-1]:t[+s.parte-1])||''}},
 letras:{n:'Mayúsculas o minúsculas',d:{modo:'mayus'},run:(s,v)=>{const t=String(v);return s.modo==='mayus'?t.toUpperCase():s.modo==='minus'?t.toLowerCase():t.toLowerCase().replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase())}},
 fechaSuma:{n:'Sumar a una fecha',d:{cant:10,uni:'habiles'},run:(s,v)=>{const d=leeF(v);if(!d)return v;let c=+s.cant||0;
   if(s.uni==='dias')d.setDate(d.getDate()+c);else if(s.uni==='meses')d.setMonth(d.getMonth()+c);else{const i=c<0?-1:1;c=Math.abs(c);while(c>0){d.setDate(d.getDate()+i);if(d.getDay()!==0&&d.getDay()!==6)c--}}return escF(d)}},
 fechaFormato:{n:'Escribir una fecha de otra forma',d:{f:'larga'},run:(s,v)=>{const d=leeF(v);if(!d)return v;return {larga:d.getDate()+' de '+MESES[d.getMonth()]+' de '+d.getFullYear(),dia:DIAS[d.getDay()],mes:MESES[d.getMonth()],anio:String(d.getFullYear()),edad:String(edad(d))}[s.f]}},
 cuenta:{n:'Hacer una cuenta',d:{oper:'+',modo:'num',num:1,campo:''},run:(s,v,p)=>{const a=leeN(v),b=s.modo==='num'?leeN(s.num):leeN(otro(s.campo,p));if(a===null||b===null)return v;if(s.oper==='/'&&b===0)return v;return escN({'+':a+b,'-':a-b,'*':a*b,'/':a/b}[s.oper])}},
 enLetra:{n:'Escribir un número en letra',d:{},run:(s,v)=>enLetra(v)}
};
function edad(d){const h=leeF(hoy);let e=h.getFullYear()-d.getFullYear();if(h.getMonth()<d.getMonth()||(h.getMonth()===d.getMonth()&&h.getDate()<d.getDate()))e--;return e}

function porN(n){return C.find(f=>f.nombre===n)}
function valor(f,p){if(f.receta)return aplicar(f.receta,p).fin;return f.val(p)||''}
function aplicar(r,p){const b=por(r.desde);let v=b?valor(b,p):'';const pasos=[v];r.pasos.forEach(s=>{v=OPS[s.op].run(s,v,p);pasos.push(v)});return{fin:v,pasos}}

 if(a==='n-crear'){const n=c.nuevo,e=!n.n.trim()?'Ponle un nombre.':(c.k==='tarea'?CT:CH).some(x=>norm(x.n)===norm(n.n))?'Ya existe con ese nombre.':(c.k==='tarea'&&n.pl==='nueva'&&(n.tipo==='generar'||n.tipo==='comunicar')&&!(n.pln||'').trim())?'Ponle nombre a la plantilla.':'';
  if(e){$('n-err').innerHTML='<div class="aviso aviso-ambar">'+esc(e)+'</div>';return true}
  const id=(c.k==='tarea'?'ct':'ch')+'n'+(AS.sig++);
  if(c.k==='tarea'){const o={id,n:n.n.trim(),tipo:n.tipo,tipos:[]};if(n.tipo==='generar'||n.tipo==='comunicar'){if(n.pl==='nueva'){const pk='pl'+id;PL[pk]={n:n.pln.trim(),c:[]};o.pl=pk}else o.pl=n.pl}CT.push(o)}
  else CH.push({id,n:n.n.trim(),exp:n.exp,tareas:n.tareas.slice(),tipos:[]});
  usar(id);return true}
 return false}
function accionAsunto(a,b){const d=b.dataset;
 if(a==='a-abrir'){AS.abierta=AS.abierta===d.t?null:d.t;AS.antes=null;AS.cam=null;pintarAsunto();return true}
 if(a==='a-campo-general'){abrirPickerA({k:'general'});return true}
 if(a==='a-campo-hito'){abrirPickerA({k:'hito',i:AS.sel});return true}
 if(a==='a-campo-tarea'){abrirPickerA({k:'tarea',t:d.t});return true}
 if(a==='a-antes'){AS.antes={t:AS.abierta,c:d.c,donde:'crear',alcance:'guia'};pintarAsunto();return true}
 if(a==='a-cancelar'){AS.antes=null;pintarAsunto();return true}
 if(a==='a-aplicar'){const x=AS.antes,f=por(x.c),gen=x.donde==='crear'||x.donde==='general',dst=gen?{k:'general'}:{k:'hito',i:+x.donde};ponerCampo(f,dst);
  const sitio=x.donde==='crear'?'al crear el asunto':x.donde==='general'?'la parte general, sin pedirlo al crear':nombreSitio(dst);
  if(x.alcance==='guia')(f.dondeExtra=f.dondeExtra||[]).push('Baja por traslado al extranjero: '+sitio);
  AS.antes=null;pintarAsunto();aviso(x.alcance==='guia'?'«'+f.nombre+'»: '+sitio+', también en los siguientes asuntos.':'«'+f.nombre+'» sale en '+nombreSitio(dst)+', solo en este asunto.');return true}
 if(a==='m-tarea'){const c=ct(d.c);AS.cam={k:'tarea',cat:c.id,n:c.n,pl:c.pl};pintarAsunto();return true}
 if(a==='m-hito'){const c=ch(AS.hitos[AS.sel].cat);AS.cam={k:'hito',cat:c.id,n:c.n,exp:c.exp};pintarAsunto();return true}
 if(a==='m-cancelar'){AS.cam=null;pintarAsunto();return true}
 if(a==='m-guardar'){const m=AS.cam,c=m.k==='tarea'?ct(m.cat):ch(m.cat);if(!m.n.trim()){return true}c.n=m.n.trim();if(m.k==='tarea'&&c.pl)c.pl=m.pl;if(m.k==='hito')c.exp=m.exp;AS.cam=null;pintarAsunto();aviso('Guardado en '+c.tipos.length+(c.tipos.length===1?' tipo.':' tipos.'));return true}
 if(a==='a-hacer'){const t=AS.hitos.flatMap(h=>h.tareas).find(x=>x.id===d.t),k=ct(t.cat);if(k.pl){t.hecha=true;aviso((k.tipo==='comunicar'?'Correo preparado':'Documento generado')+' con los datos del asunto.')}else t.hecha=!t.hecha;pintarAsunto();return true}
 if(a==='a-ntarea'||a==='a-nhito'){E.cat={k:a==='a-ntarea'?'tarea':'hito',q:'',f:'',modo:'lista',alc:'guia',nuevo:null,foco:true};pintarCapa();return true}
 if(accionCat(a,b))return true;
 return false}

/* ---------- ventana de elegir ---------- */
function clase(){return TIPOS[E.tipo].clase}
function sirve(f){return f.clases[0]==='Todas'||f.clases.includes(clase())}
function pintarCapa(){
 const s=$('capa-sitio');
 if(E.cat){pintarCat(s);return}
 if(!E.pk){s.innerHTML='';return}
 const pk=E.pk,q=pk.q.trim().toLowerCase();
 const mas=C.filter(f=>f.tipos.includes(E.tipo)).sort((a,b)=>usosDe(b).length-usosDe(a).length).slice(0,6);
 let centro='';
 if(pk.modo==='nuevo'){
  const f=pk.nuevo;
  centro='<div class="panel" style="border:0;padding:4px"><h2>Campo manual nuevo</h2><div><label class="et" for="d-nombre">Nombre</label><input id="d-nombre" value="'+esc(f.nombre)+'"></div>'+formManual(f)+'<div id="d-error"></div><div class="en-linea"><button class="boton principal" data-acc="pk-crear-manual">Crear e insertar</button><button class="boton" data-acc="pk-volver">Volver</button></div></div>';
 }else{
  let lista=C.filter(f=>q?busca(f,q):f.grupo===pk.g);
  const buenos=lista.filter(sirve),otros=lista.filter(f=>!sirve(f));
  const fila=f=>'<button class="fila-campo" data-ins="'+f.id+'"><span>'+esc(f.nombre)+(q?' <span class="suave pequeno">· '+esc(f.grupo)+'</span>':'')+'</span><span class="ej suave pequeno">→ '+ej(f)+'</span><span class="etq'+(f.origen==='Manual'?' manual':f.receta?' calc':'')+'">'+esc(tablaDe(f).t)+'</span></button>';
  centro=(buenos.map(fila).join('')||(otros.length?'':'<p class="vacio" style="margin:6px">'+(q?'Ningún campo con ese nombre. Puedes crearlo abajo.':'Este grupo no tiene campos.')+'</p>'))+
   (otros.length?(pk.verOtros?'<p class="pequeno suave" style="margin:10px 6px 2px">Son de otra clase de persona: en este tipo pueden salir vacíos.</p>'+otros.map(fila).join(''):'<button class="boton mini" style="margin-top:8px" data-acc="pk-otros">Ver '+otros.length+' de otra clase de persona</button>'):'');
 }
 s.innerHTML='<div class="capa" id="capa"><div class="cuadro" role="dialog" aria-modal="true" aria-label="Elegir un campo"><div class="cuadro-cab">'+
  '<div class="en-linea"><h2>Elegir un campo</h2><span class="suave pequeno">para '+esc(TIPOS[E.tipo].n)+'</span><button class="boton mini empuja" data-acc="pk-cerrar">Cerrar</button></div>'+
  (pk.modo==='nuevo'?'':'<input id="pk-q" placeholder="Buscar por campo, tabla o columna" value="'+esc(pk.q)+'" aria-label="Buscar por campo, tabla o columna">'+
  '<div class="en-linea"><span class="pequeno suave">Los más usados en este tipo:</span>'+(mas.map(f=>'<button class="pastilla" data-ins="'+f.id+'">'+esc(f.nombre)+'</button>').join('')||'<span class="vacio pequeno">todavía ninguno</span>')+'</div>')+
  '</div><div class="cuadro-cuerpo"><div class="grupos">'+GRUPOS.map(g=>{const n=C.filter(f=>f.grupo===g&&sirve(f)).length;return '<button class="grupo'+(!q&&pk.g===g&&pk.modo!=='nuevo'?' on':'')+'" data-pkg="'+g+'"><span>'+g+'</span><span>'+n+'</span></button>'}).join('')+'</div>'+
  '<div class="resultados">'+centro+'</div></div>'+
  '<div class="cuadro-pie">'+(E.dest&&E.dest.k!=='tarea'?'<span class="en-linea" style="flex:1;min-width:220px"><label class="pequeno suave" for="pk-alc">Para</label><select id="pk-alc" style="width:auto;flex:1"><option value="aqui"'+(E.destAlc==='aqui'?' selected':'')+'>Solo este asunto</option>'+(E.dest.k==='general'?'<option value="crear"'+(E.destAlc==='crear'?' selected':'')+'>Los siguientes: pedirlo al crear el asunto</option><option value="general"'+(E.destAlc==='general'?' selected':'')+'>Los siguientes: en la parte general, sin pedirlo al crear</option>':'<option value="guia"'+(E.destAlc==='guia'?' selected':'')+'>Los siguientes: pedirlo en este hito</option>')+'</select></span>':'<span class="pequeno suave">Ejemplos con '+esc(P().t)+'</span>')+'<span class="en-linea"><button class="boton" data-acc="pk-nuevo-manual">+ Campo manual nuevo</button><button class="boton" data-acc="pk-nueva-receta">+ Crear a partir de otros</button></span></div></div></div>';
 const q2=$('pk-q');if(q2&&pk.foco){q2.focus();q2.setSelectionRange(q2.value.length,q2.value.length)}
}
function insertar(nombre){
 if(E.dest){const f=porN(nombre),d=E.dest,al=E.destAlc;E.dest=null;E.pk=null;E.tab='asunto';ponerCampo(f,d);
  if(al&&al!=='aqui'){const si=al==='crear'?'al crear el asunto':al==='general'?'la parte general, sin pedirlo al crear':nombreSitio(d);(f.dondeExtra=f.dondeExtra||[]).push('Baja por traslado al extranjero: '+si)}
  pintar();aviso('«'+nombre+'» añadido a '+nombreSitio(d)+(al&&al!=='aqui'?', también en los siguientes asuntos.':'.'));return}
 const t='{{'+nombre+'}}',c=E.cursor==null?E.texto.length:E.cursor;
 E.texto=E.texto.slice(0,c)+t+E.texto.slice(c);E.cursor=c+t.length;E.pk=null;E.tab='plantilla';pintar();
 const a=$('p-texto');if(a){a.focus();a.setSelectionRange(E.cursor,E.cursor)}
 aviso('Insertado «'+nombre+'».');
}
function validarNombre(n,idActual){n=n.trim();if(!n)return 'Ponle un nombre.';if(C.some(f=>f.nombre.toLowerCase()===n.toLowerCase()&&f.id!==idActual))return 'Ya hay un campo con ese nombre.';return ''}
function error(id,t){const n=$(id);if(n)n.innerHTML=t?'<div class="aviso aviso-ambar">'+esc(t)+'</div>':''}
function campoManual(d){return campo(d.nombre.trim(),d.grupo||'Asunto','Manual',()=>'',{clase:d.clase,opciones:d.opciones,pide:d.pide,hito:d.pide==='En un hito'?(d.hito||HITOS[0]):''})}

/* ---------- eventos ---------- */
document.addEventListener('click',ev=>{
 const b=ev.target.closest('button,tr[data-f]');
 if(ev.target.id==='capa'){E.pk=null;E.dest=null;E.cat=null;pintarCapa();return}
 if(!b)return;
 const d=b.dataset;
 if(d.tab){E.tab=d.tab;E.pk=null;E.dest=null;pintar();return}
 if(d.hito!==undefined){AS.sel=+d.hito;AS.cam=null;AS.antes=null;pintarAsunto();return}
 if(d.f){E.sel=d.f;E.nuevoManual=null;pintarLista();return}
 if(d.g!==undefined){E.g=d.g;pintarLista();return}
 if(d.ins){insertar(por(d.ins).nombre);return}
 if(d.cat){usar(d.cat);return}
 if(d.cf!==undefined){E.cat.f=d.cf;E.cat.foco=false;pintarCapa();return}
 if(d.pkg){E.pk.g=d.pkg;E.pk.q='';E.pk.modo='lista';E.pk.verOtros=false;E.pk.foco=false;pintarCapa();return}
 if(d.muestra){const f=por(d.muestra);E.ed=edDe(f);pintarReceta();return}
 const a=d.acc,i=d.paso===undefined?-1:+d.paso,ed=E.ed;
 if(!a)return;
 if(accionAsunto(a,b))return;
 if(a==='nuevo-manual'){E.nuevoManual={nombre:'',grupo:'Asunto',clase:'Texto',opciones:'',pide:'Al generar el documento'};E.sel=null;pintarLista();$('d-nombre').focus()}
 else if(a==='cancelar-manual'){E.nuevoManual=null;pintarLista()}
 else if(a==='guardar-manual'){const e=validarNombre(E.nuevoManual.nombre);if(e)return error('d-error',e);const f=campoManual(E.nuevoManual);C.push(f);E.nuevoManual=null;E.sel=f.id;E.g='';pintarLista();aviso('Campo «'+f.nombre+'» creado.')}
 else if(a==='nueva-receta'){E.ed=nuevoEd();E.trasGuardar=null;E.tab='receta';pintar()}
 else if(a==='cambiar-receta'){const f=por(E.sel);E.ed=edDe(f);E.trasGuardar=null;E.tab='receta';pintar()}
 else if(a==='quitar'){const f=por(E.sel);C.splice(C.indexOf(f),1);E.sel=null;pintarLista();aviso('Campo «'+f.nombre+'» quitado.')}
 else if(a==='abrir-picker'){E.dest=null;E.pk={g:'Persona',q:'',modo:'lista',verOtros:false,foco:true};pintarCapa()}
 else if(a==='pk-cerrar'){E.pk=null;E.dest=null;pintarCapa()}
 else if(a==='pk-otros'){E.pk.verOtros=true;E.pk.foco=false;pintarCapa()}
 else if(a==='pk-nuevo-manual'){E.pk.modo='nuevo';E.pk.nuevo={nombre:E.pk.q,grupo:'Asunto',clase:'Texto',opciones:'',pide:'Al generar el documento'};E.pk.foco=false;pintarCapa();$('d-nombre').focus()}
 else if(a==='pk-volver'){E.pk.modo='lista';E.pk.foco=true;pintarCapa()}
 else if(a==='pk-crear-manual'){const e=validarNombre(E.pk.nuevo.nombre);if(e)return error('d-error',e);const f=campoManual(E.pk.nuevo);f.tipos=[E.tipo];C.push(f);insertar(f.nombre)}
 else if(a==='pk-nueva-receta'){E.ed=nuevoEd();E.ed.nombre=E.pk.q;E.trasGuardar='insertar';E.pk=null;E.tab='receta';pintar()}
 else if(a==='subir'||a==='bajar'){const j=a==='subir'?i-1:i+1,s=ed.pasos;[s[i],s[j]]=[s[j],s[i]];pintarReceta()}
 else if(a==='quitar-paso'){ed.pasos.splice(i,1);pintarReceta()}
 else if(a==='anadir-fila'){ed.pasos[i].filas.push({de:'',a:''});pintarReceta()}
 else if(a==='quitar-fila'){const fl=ed.pasos[i].filas;fl.splice(+d.fila,1);if(!fl.length)fl.push({de:'',a:''});pintarReceta()}
 else if(a==='limpiar-receta'){E.ed=nuevoEd();E.trasGuardar=null;pintarReceta();$('r-nombre').focus()}
 else if(a==='guardar-receta'){
  const e=validarNombre(ed.nombre,ed.id);if(e)return error('r-error',e);

  const rec={desde:ed.desde,pasos:JSON.parse(JSON.stringify(ed.pasos))};
  let f;if(ed.id){f=por(ed.id);f.nombre=ed.nombre.trim();f.grupo=ed.grupo;f.receta=rec;f.clases=clasesDe(ed)}

  if(E.trasGuardar==='insertar'){E.trasGuardar=null;E.ed=edDe(f);insertar(f.nombre);return}
  E.ed=edDe(f);E.sel=f.id;pintarReceta();aviso('Campo «'+f.nombre+'» guardado. Ya sale en la lista.');
 }
});

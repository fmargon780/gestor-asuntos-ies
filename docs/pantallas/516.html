<title>Prueba tema 516</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: ficha de un asunto a todo el ancho; arriba, lo que pasa fuera de la app; debajo, el hito a la izquierda y la carpeta (o el documento abierto) a la derecha, como en la pestaña Trabajo. */
:root{
  --tinta:#1b2430;--tinta-suave:#5d6b7a;--linea:#dde3ea;--fondo:#f4f6f9;--papel:#fff;
  --azul:#1f4e79;--azul-claro:#e8f0f8;--ambar:#fff4d6;--ambar-linea:#e0b34a;--verde:#e7f5ec;--verde-tinta:#1e7a46;
  --hover:#f0f3f7;--fuente:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --tinta:#e6ebf1;--tinta-suave:#9aa8b6;--linea:#2e3a47;--fondo:#121820;--papel:#1a222c;
  --azul:#5b9bd5;--azul-claro:#1d3044;--ambar:#3a3018;--ambar-linea:#b8902f;--verde:#16301f;--verde-tinta:#7fd19c;
  --hover:#222c37;color-scheme:dark}}
:root[data-theme="dark"]{
  --tinta:#e6ebf1;--tinta-suave:#9aa8b6;--linea:#2e3a47;--fondo:#121820;--papel:#1a222c;
  --azul:#5b9bd5;--azul-claro:#1d3044;--ambar:#3a3018;--ambar-linea:#b8902f;--verde:#16301f;--verde-tinta:#7fd19c;
  --hover:#222c37;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--fondo);color:var(--tinta);font-family:var(--fuente);font-size:15px}
main{padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
h1{font-size:20px;margin:0;text-wrap:balance}
h2{font-size:15px;margin:0 0 8px}
.cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{font-size:12px;background:var(--azul-claro);color:var(--azul);border-radius:999px;padding:3px 10px;font-weight:600}
.bloque{background:var(--papel);border:1px solid var(--linea);border-radius:10px;padding:12px 14px;min-width:0}
.fuera{border-style:dashed}
.fuera p{margin:0 0 8px;color:var(--tinta-suave);font-size:13px}
.simula{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.boton{font:inherit;font-size:14px;background:var(--papel);color:var(--tinta);border:1px solid var(--linea);border-radius:8px;padding:7px 12px;cursor:pointer;text-align:left}
.boton:hover:not(:disabled){background:var(--hover)}
.boton:disabled{opacity:.45;cursor:default}
.boton-principal{background:var(--azul);color:#fff;border-color:var(--azul)}
.boton-principal:hover:not(:disabled){background:var(--azul)}
.boton:focus-visible,select:focus-visible{outline:2px solid var(--azul);outline-offset:2px}
.mini{font-size:12px;padding:2px 8px}
.pie{display:flex;justify-content:flex-end;margin-top:8px}
.aviso{border-radius:8px;padding:10px 12px}
.aviso p{margin:4px 0 8px}
.aviso-ambar{background:var(--ambar);border:1px solid var(--ambar-linea)}
.aviso-verde{background:var(--verde);color:var(--verde-tinta)}
.sello-fila{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select{font:inherit;font-size:14px;border:1px solid var(--linea);border-radius:8px;padding:7px 10px;background:var(--papel);color:var(--tinta);max-width:100%}
.suave{color:var(--tinta-suave)}
.columnas{display:grid;grid-template-columns:3fr 2fr;gap:12px;align-items:start}
.pila{display:flex;flex-direction:column;gap:12px;min-width:0}
.doc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 0;border-top:1px solid var(--linea)}
.doc:first-of-type{border-top:0}
.ext{font-size:11px;font-weight:700;color:var(--azul);background:var(--azul-claro);border-radius:4px;padding:1px 5px}
.nombre{overflow-wrap:anywhere;min-width:0}
.datos{color:var(--tinta-suave);font-size:13px}
.sin-reg{font-size:12px;background:var(--ambar);border:1px solid var(--ambar-linea);border-radius:999px;padding:1px 8px}
.nota{padding:7px 0;border-top:1px solid var(--linea);font-size:14px}
.nota:first-of-type{border-top:0}
.nota small{display:block;color:var(--tinta-suave)}
.vacio{color:var(--tinta-suave);font-size:14px;margin:0}
@media (max-width:760px){.simula,.columnas{grid-template-columns:1fr}}

.tira{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tira span{font-size:13px;border:1px solid var(--linea);border-radius:999px;padding:3px 10px;color:var(--tinta-suave)}
.tira span.actual{background:var(--azul-claro);color:var(--azul);border-color:var(--azul);font-weight:600}
.mesa-cab{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:6px}
.mesa-cab h2{margin:0;font-size:16px}
.mesa-botones{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.linea-hacer{font-size:13px;color:var(--tinta-suave);margin:0 0 8px}
.resaltado{box-shadow:0 0 0 3px var(--verde-tinta)}
.tarea{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:7px 0;border-top:1px solid var(--linea)}
.tarea label{display:flex;gap:8px;align-items:center;flex:1;min-width:0;cursor:pointer}
.tarea.hecha .tt{color:var(--tinta-suave);text-decoration:line-through}
.tarea.na .tt{color:var(--tinta-suave);font-style:italic}
.clase{font-size:11px;font-weight:600;color:var(--azul);background:var(--azul-claro);border-radius:4px;padding:1px 6px}
.enlace{font:inherit;font-size:13px;background:none;border:0;color:var(--azul);cursor:pointer;padding:2px;text-decoration:underline}
.editor{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.editor label{font-size:13px;color:var(--tinta-suave);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.capa{position:fixed;inset:0;background:rgba(20,30,45,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.cuadro{background:var(--papel);border-radius:10px;padding:16px;width:min(640px,100%);display:flex;flex-direction:column;gap:10px}
.cuadro h3{margin:0;font-size:17px}
.cuadro ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.cuadro .pie{gap:8px;margin:0}
.archivado{background:var(--verde);color:var(--verde-tinta);border-radius:8px;padding:10px 12px}

.tarea-bloque{border-top:1px solid var(--linea);padding:3px 0}
.tarea-bloque .tarea{border-top:0}
.colgado{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:2px 0 6px 26px;font-size:14px}
.colgado.apagado{opacity:.65}
.abrir{font:inherit;font-size:14px;background:none;border:0;color:var(--azul);cursor:pointer;padding:0;text-align:left;overflow-wrap:anywhere}
.abrir:hover{text-decoration:underline}
.sin-doc{font-size:13px;color:var(--tinta-suave)}
.colgado select{font-size:13px;padding:3px 6px}
.visor-cab{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.folio{background:#fff;color:#1b2430;border:1px solid var(--linea);border-radius:4px;padding:20px 24px;min-height:300px;font-size:14px;line-height:1.5}
.folio h3{margin:0 0 10px;font-size:15px;text-align:center}
.folio .marca{margin-top:30px;border:1px dashed #8a97a5;border-radius:6px;padding:8px;color:#5d6b7a;font-size:13px}
h2.sub{margin-top:10px}
</style>
<main>
  <div class="cab"><h1>261103 A26-0412 RECLAMACIÓN NOTAS Reyes Palma, Lucía</h1><span class="chip">Pantalla de prueba · datos inventados</span>
    <span style="flex:1"></span><button id="archivar" class="boton">Archivar el asunto</button></div>

  <section class="bloque fuera">
    <h2>Lo que pasa fuera de la app</h2>
    <p id="pista"></p>
    <div class="simula">
      <button id="s-firmado" class="boton" disabled>Guardar encima el PDF firmado</button>
      <button id="s-sellado" class="boton" disabled>Guardar encima el PDF registrado en Séneca</button>
      <button id="s-sinruta" class="boton">Guardar el firmado sin haber pulsado «Ruta»</button>
    </div>
    <div class="pie"><button id="s-reinicio" class="boton mini">Empezar de nuevo</button></div>
  </section>

  <div id="avisos" class="pila" aria-live="polite"></div>

  <div class="columnas">
    <div class="pila">
      <section class="bloque" id="mesa"></section>
      <section class="bloque">
        <h2>En la guía de este tipo de asunto</h2>
        <div class="editor"><label for="accion">Tarea «Firmar la resolución» · Qué se hace
          <select id="accion">
            <option value="">Sin acción (se marca a mano)</option>
            <option value="firmar" selected>Firmar un documento</option>
          </select></label>
          <span id="accion-ayuda" class="datos"></span></div>
      </section>
    </div>
    <div class="pila">
      <section class="bloque" id="derecha"></section>
      <section class="bloque"><h2>Notas</h2><div id="notas"></div></section>
    </div>
  </div>
  <div id="capa"></div>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var HOY = '05/11/2026';
  var e;
  var CLASE = { generar: 'Generar', firmar: 'Firmar', registrar: 'Registrar', comunicar: 'Comunicar' };

  function inicial() {
    e = {
      tareas: [
        { id: 'g', texto: 'Generar la resolución', accion: 'generar', doc: null },
        { id: 'f', texto: 'Firmar la resolución', accion: 'firmar', doc: null },
        { id: 'r', texto: 'Registrar de salida la resolución', accion: 'registrar', doc: null },
        { id: 'c', texto: 'Comunicar la resolución a la familia', accion: 'comunicar', doc: null },
        { id: 'i', texto: 'Firmar el informe del departamento', accion: 'firmar', doc: null }
      ],
      docs: [
        { id: 'a', nombre: '261103 ALEGACIONES D26-01231.pdf', hito: 1, firmas: 0, registro: '', pendiente: true },
        { id: 'n', nombre: '261104 INFORME DEPARTAMENTO D26-01236.pdf', hito: 2, firmas: 0, registro: '', pendiente: false }
      ],
      notas: [], elegido: null, cadena: null, hitoHecho: false, verde: '', ambar: '', cuadro: null, archivado: false,
      abierto: null, abiertaVersion: null, eligiendo: null
    };
    if ($('accion')) $('accion').value = 'firmar';
  }

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function tarea(id) { return e.tareas.filter(function (t) { return t.id === id; })[0]; }
  function doc(id) { return e.docs.filter(function (d) { return d.id === id; })[0]; }
  function abierta(t) { return !t.hecha && !t.na; }
  function conDoc(t) { return t.accion === 'generar' || t.accion === 'firmar' || t.accion === 'registrar'; }

  function avanzar() {
    if (!e.cadena) return;
    var t = e.tareas.filter(function (x) {
      return abierta(x) && (x.accion === 'comunicar' || ((x.accion === 'firmar' || x.accion === 'registrar') && x.doc));
    })[0];
    e.cadena = !t ? null : t.accion === 'firmar' ? 'firma' : t.accion === 'registrar' ? 'sello' : 'enviar';
  }

  function faltaHito() {
    var l = [], vistos = {};
    e.tareas.forEach(function (t) {
      if (!abierta(t) || (t.accion !== 'firmar' && t.accion !== 'registrar')) return;
      if (t.doc) { l.push(CLASE[t.accion] + ': ' + doc(t.doc).nombre); if (t.accion === 'registrar') vistos[t.doc] = 1; }
      else l.push(t.texto + ' (sin documento)');
    });
    e.docs.forEach(function (d) { if (d.hito === 2 && d.pendiente && !d.registro && !vistos[d.id]) l.push('Registrar: ' + d.nombre); });
    return l;
  }
  function faltaAsunto() {
    var l = faltaHito();
    e.docs.forEach(function (d) { if (d.hito !== 2 && d.pendiente && !d.registro) l.push('Registrar: ' + d.nombre); });
    return l;
  }

  function datos(d) {
    var p = [];
    if (d.firmas) p.push('Firmado');
    if (d.registro) p.push('Registro ' + d.registro);
    return p.join(' · ');
  }
  function botonRuta(d) { return '<button class="boton mini" data-ruta="' + d.id + '">' + (e.elegido === d.id ? 'Ruta ✓' : 'Ruta') + '</button>'; }
  function lineaDoc(d, conHito) {
    var l = datos(d);
    return '<span class="ext">PDF</span><button class="abrir" data-abrir="' + d.id + '">' + esc(d.nombre) + '</button>' +
      (conHito ? '<span class="datos">Hito ' + d.hito + '</span>' : '') + botonRuta(d) +
      (l ? '<span class="datos">' + esc(l) + '</span>' : '') +
      (!d.registro && d.pendiente ? '<span class="sin-reg">Sin registrar</span>' : '');
  }
  function selector(t) {
    return '<select data-sel="' + t.id + '" aria-label="Documento de la tarea"><option value="">Elige un documento…</option>' +
      e.docs.map(function (d) { return '<option value="' + d.id + '"' + (t.doc === d.id ? ' selected' : '') + '>' + esc(d.nombre) + '</option>'; }).join('') + '</select>';
  }
  function colgado(t) {
    if (!conDoc(t) || t.na) return '';
    if (e.eligiendo === t.id) return '<div class="colgado">' + selector(t) + '<button class="enlace" data-cerrar="1">Cancelar</button></div>';
    if (t.hecha && t.verNombre) {
      return '<div class="colgado apagado"><span class="ext">PDF</span><button class="abrir" data-version="' + t.id + '">' + esc(t.verNombre) + '</button>' +
        (t.verDatos ? '<span class="datos">' + esc(t.verDatos) + '</span>' : '') + '</div>';
    }
    if (t.doc) {
      return '<div class="colgado' + (t.hecha ? ' apagado' : '') + '">' + lineaDoc(doc(t.doc), false) +
        (t.hecha || t.accion === 'generar' ? '' : '<button class="enlace" data-elegir="' + t.id + '">Cambiar</button>') + '</div>';
    }
    if (t.accion === 'generar') return '';
    if (t.hecha) return '';
    if (t.id === 'f' || t.id === 'r') {
      if (abierta(tarea('g'))) return '<div class="colgado"><span class="sin-doc">Saldrá aquí al generar la resolución.</span></div>';
    }
    return '<div class="colgado"><button class="enlace" data-elegir="' + t.id + '">Elegir documento</button></div>';
  }

  function pintarMesa() {
    var cuenta = e.tareas.filter(function (t) { return !t.na; });
    var completo = cuenta.every(function (t) { return t.hecha; }) && !e.hitoHecho;
    var bot = '';
    if (e.hitoHecho) bot = '';
    else if (e.cadena === 'firma') bot = '<button class="boton" disabled>Esperando el PDF firmado</button><button id="dejar" class="enlace">Dejar de esperar</button>';
    else if (e.cadena === 'sello') bot = '<button class="boton" disabled>Esperando el PDF sellado</button><button id="dejar" class="enlace">Dejar de esperar</button>';
    else if (e.cadena === 'enviar') bot = '<button id="enviar" class="boton boton-principal">Enviar</button>';
    else if (abierta(tarea('g')) || abierta(tarea('c'))) bot = '<button id="hacer" class="boton boton-principal">Hacer este hito</button>';
    var res = tarea('g').doc;
    if (!e.hitoHecho && e.cadena !== 'enviar' && res && abierta(tarea('c'))) bot += '<button id="comunicar" class="boton">Comunicar con la resolución adjunta</button>';
    var partes = e.tareas.filter(abierta).map(function (t) {
      return t.accion === 'generar' ? 'Genera «Resolución»' : t.id === 'f' && t.accion === 'firmar' ? 'espera la firma' : t.accion === 'registrar' ? 'espera el registro en Séneca' : t.accion === 'comunicar' ? 'correo a la familia' : '';
    }).filter(Boolean);
    var html = '<div class="tira"><span>✓ 1. Recibir la reclamación</span><span class="' + (e.hitoHecho ? '' : 'actual') + '">' + (e.hitoHecho ? '✓ ' : '') + '2. Resolver</span><span class="' + (e.hitoHecho ? 'actual' : '') + '">3. Cerrar</span></div>';
    html += '<div class="mesa-cab"><h2>2. Resolver</h2><div class="mesa-botones">' + bot +
      '<button id="marcar" class="boton' + (e.hitoHecho ? '' : ' boton-principal') + (completo ? ' resaltado' : '') + '">' + (e.hitoHecho ? 'Hecho ✓ (desmarcar)' : 'Marcar como hecho') + '</button></div></div>';
    if (!e.cadena && !e.hitoHecho && partes.length) html += '<p class="linea-hacer">' + esc(partes.join(' → ')) + '</p>';
    html += '<h2 class="sub">Tareas</h2>';
    html += e.tareas.map(function (t) {
      return '<div class="tarea-bloque"><div class="tarea' + (t.hecha ? ' hecha' : '') + (t.na ? ' na' : '') + '"><label><input type="checkbox" data-t="' + t.id + '"' + (t.hecha ? ' checked' : '') + (t.na ? ' disabled' : '') + '>' +
        '<span class="tt">' + esc(t.texto) + '</span></label>' +
        (t.accion ? '<span class="clase">' + CLASE[t.accion] + '</span>' : '') +
        '<button class="enlace" data-na="' + t.id + '">' + (t.na ? 'Sí aplica' : 'No aplica') + '</button></div>' + colgado(t) + '</div>';
    }).join('');
    html += '<h2 class="sub">Documentos de este hito</h2>' + e.docs.filter(function (d) { return d.hito === 2; }).map(function (d) {
      return '<div class="doc">' + lineaDoc(d, false) + '</div>';
    }).join('');
    $('mesa').innerHTML = html;
  }

  function pintarDerecha() {
    var v = e.abiertaVersion && tarea(e.abiertaVersion);
    if (v) {
      $('derecha').innerHTML = '<div class="visor-cab"><button id="a-carpeta" class="boton mini">← Carpeta</button><span class="datos" style="overflow-wrap:anywhere">' + esc(v.verNombre) + '</span></div>' +
        '<div class="folio"><h3>Versión anterior</h3><p>Así estaba el documento al terminar la tarea «' + esc(v.texto) + '». Se conserva en «_Previas».</p>' +
        (v.verDatos ? '<div class="marca">' + esc(v.verDatos) + '</div>' : '') + '</div>';
      return;
    }
    var d = e.abierto && doc(e.abierto);
    if (d) {
      $('derecha').innerHTML = '<div class="visor-cab"><button id="a-carpeta" class="boton mini">← Carpeta</button><span class="datos" style="overflow-wrap:anywhere">' + esc(d.nombre) + '</span>' + botonRuta(d) + '</div>' +
        '<div class="folio"><h3>' + esc(d.nombre.replace(/^\d+ /, '').replace(/ D26.*$/, '')) + '</h3><p>Documento inventado para la prueba. Aquí se ve el PDF abierto, ocupando la columna de la carpeta; el hito sigue a la izquierda.</p>' +
        (datos(d) ? '<div class="marca">' + esc(datos(d)) + '</div>' : '') + '</div>';
    } else {
      $('derecha').innerHTML = '<h2>Carpeta del asunto</h2>' + e.docs.map(function (x) { return '<div class="doc">' + lineaDoc(x, true) + '</div>'; }).join('');
    }
  }

  function pintar() {
    pintarMesa(); pintarDerecha();
    $('notas').innerHTML = e.notas.length ? e.notas.map(function (n) { return '<div class="nota">' + esc(n) + '</div>'; }).join('') : '<p class="vacio">Sin notas.</p>';
    var av = '';
    if (e.archivado) av += '<div class="archivado">Asunto archivado. En la prueba no se mueve nada: pulsa «Empezar de nuevo».</div>';
    if (e.verde) av += '<div class="aviso aviso-verde">' + esc(e.verde) + '</div>';
    if (e.ambar) av += '<div class="aviso aviso-ambar">' + esc(e.ambar) + '</div>';
    $('avisos').innerHTML = av;
    var c = '';
    if (e.cuadro) {
      c = '<div class="capa"><div class="cuadro" role="dialog" aria-modal="true"><h3>' + esc(e.cuadro.titulo) + '</h3><ul>' +
        e.cuadro.lista.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' +
        '<div class="pie"><button id="c-volver" class="boton">Volver</button><button id="c-seguir" class="boton boton-principal">' + esc(e.cuadro.boton) + '</button></div></div></div>';
    }
    $('capa').innerHTML = c;
    $('accion-ayuda').textContent = tarea('f').accion === 'firmar' ? 'Se marca sola al llegar firmado su documento.' : 'Se marca a mano, sin documento, y no cuenta en los avisos.';
    var hay = e.elegido !== null && !e.archivado;
    $('s-firmado').disabled = !hay; $('s-sellado').disabled = !hay;
    $('pista').textContent = hay ? 'Guardarás encima de ' + doc(e.elegido).nombre + '.' : 'Para los dos primeros, pulsa antes «Ruta» en un documento. Eso marca el documento sobre el que guardas.';
    enganchar();
  }

  function limpiar() { e.verde = ''; e.ambar = ''; }

  /* Llega una versión nueva: la tarea que dejó la anterior se queda con ella, con el nombre que recibe en «_Previas». */
  function pasarAPrevias(d, sufijo) {
    var t = d.ultima && tarea(d.ultima);
    if (t) { t.verNombre = d.nombre.replace(/\.pdf$/, ' ' + sufijo + '.pdf'); t.verDatos = datos(d); }
    d.ultima = null;
  }

  function generar() {
    var t = tarea('g');
    if (!abierta(t)) return;
    t.hecha = true;
    e.docs.push({ id: 'res', nombre: '261105 RESOLUCION D26-01240.pdf', hito: 2, firmas: 0, registro: '', pendiente: false });
    t.doc = 'res'; doc('res').ultima = 'g';
    ['f', 'r'].forEach(function (id) { var x = tarea(id); if (!x.doc && conDoc(x)) x.doc = 'res'; });
    e.verde = 'Documento generado: 261105 RESOLUCION D26-01240.pdf';
  }

  function enviarCorreo() {
    tarea('c').hecha = true;
    var n = doc('res').nombre;
    e.verde = 'Correo enviado a la familia con ' + n + '. En la prueba no se envía nada.';
    e.notas.unshift('Enviado a la familia el ' + HOY + ' · ' + n); e.cadena = null; pintar();
  }
  function marcarHecho() { e.hitoHecho = true; e.cadena = null; e.verde = 'Hito marcado como hecho. Pasas al hito 3.'; pintar(); }
  function archivar() { limpiar(); e.archivado = true; e.elegido = null; pintar(); }

  function enganchar() {
    var g = function (id, fn) { var b = $(id); if (b) b.onclick = fn; };
    var todos = function (sel, fn) { Array.prototype.forEach.call(document.querySelectorAll(sel), fn); };
    g('hacer', function () { limpiar(); generar(); e.cadena = 'x'; avanzar(); pintar(); });
    g('dejar', function () { limpiar(); e.cadena = null; pintar(); });
    var alEnviar = function () {
      limpiar();
      var n = doc('res').nombre;
      var f = faltaHito().filter(function (x) { return x.indexOf(n) !== -1; });
      if (f.length) { e.cuadro = { titulo: 'Falta por hacer en lo que vas a enviar', lista: f, boton: 'Enviar igualmente', fn: enviarCorreo }; pintar(); return; }
      enviarCorreo();
    };
    g('enviar', alEnviar); g('comunicar', alEnviar);
    g('marcar', function () {
      limpiar();
      if (e.hitoHecho) { e.hitoHecho = false; pintar(); return; }
      var f = faltaHito();
      if (f.length) { e.cuadro = { titulo: 'Falta por hacer en este hito', lista: f, boton: 'Marcar como hecho igualmente', fn: marcarHecho }; pintar(); return; }
      marcarHecho();
    });
    g('c-volver', function () { e.cuadro = null; pintar(); });
    g('c-seguir', function () { var fn = e.cuadro.fn; e.cuadro = null; fn(); });
    g('a-carpeta', function () { e.abierto = null; e.abiertaVersion = null; pintar(); });
    todos('[data-t]', function (b) {
      b.onchange = function () {
        limpiar(); var t = tarea(b.dataset.t);
        if (t.id === 'g' && b.checked) generar(); else t.hecha = b.checked;
        avanzar(); pintar();
      };
    });
    todos('[data-na]', function (b) { b.onclick = function () { limpiar(); var t = tarea(b.dataset.na); t.na = !t.na; t.hecha = false; avanzar(); pintar(); }; });
    todos('[data-ruta]', function (b) { b.onclick = function () { limpiar(); var i = b.dataset.ruta; e.elegido = e.elegido === i ? null : i; pintar(); }; });
    todos('[data-abrir]', function (b) { b.onclick = function () { limpiar(); e.abiertaVersion = null; e.abierto = b.dataset.abrir; pintar(); }; });
    todos('[data-version]', function (b) { b.onclick = function () { limpiar(); e.abierto = null; e.abiertaVersion = b.dataset.version; pintar(); }; });
    todos('[data-elegir]', function (b) { b.onclick = function () { limpiar(); e.eligiendo = b.dataset.elegir; pintar(); }; });
    todos('[data-cerrar]', function (b) { b.onclick = function () { e.eligiendo = null; pintar(); }; });
    todos('[data-sel]', function (b) { b.onchange = function () { limpiar(); var t = tarea(b.dataset.sel); t.doc = b.value || null; e.eligiendo = null; avanzar(); pintar(); }; });
  }

  $('archivar').onclick = function () {
    limpiar();
    if (e.archivado) return;
    var f = faltaAsunto();
    e.cuadro = f.length
      ? { titulo: 'Falta por hacer en este asunto', lista: f, boton: 'Archivar igualmente', fn: archivar }
      : { titulo: 'Archivar el asunto', lista: ['Se llevará la carpeta al archivo.'], boton: 'Archivar el asunto', fn: archivar };
    pintar();
  };

  $('s-firmado').onclick = function () {
    limpiar(); var d = doc(e.elegido); e.elegido = null;
    pasarAPrevias(d, 'SIN FIRMAR');
    d.firmas = 1; e.verde = 'Documento firmado. El original sin firmar se conserva en «_Previas».';
    e.notas.unshift('Firmado el ' + HOY + ' · ' + d.nombre);
    e.tareas.forEach(function (t) {
      if (t.accion === 'firmar' && t.doc === d.id && abierta(t)) { t.hecha = true; d.ultima = t.id; e.verde += ' Marcado: ' + t.texto + '.'; }
    });
    avanzar(); pintar();
  };
  $('s-sellado').onclick = function () {
    limpiar(); var d = doc(e.elegido); e.elegido = null;
    pasarAPrevias(d, 'SIN SELLAR');
    d.registro = '26SM0' + (412 + e.notas.length); d.pendiente = false;
    e.verde = 'Documento registrado.';
    e.notas.unshift('Registrado ' + d.registro + ' el ' + HOY + ' · ' + d.nombre);
    e.tareas.forEach(function (t) {
      if (t.accion === 'registrar' && t.doc === d.id && abierta(t)) { t.hecha = true; d.ultima = t.id; e.verde += ' Marcado: ' + t.texto + '.'; }
    });
    avanzar(); pintar();
  };
  $('s-sinruta').onclick = function () { limpiar(); e.ambar = 'La app no se ha enterado: no cambia nada. Hay que marcar la tarea a mano.'; pintar(); };
  $('s-reinicio').onclick = function () { inicial(); pintar(); };
  $('accion').onchange = function () {
    limpiar(); var t = tarea('f'); t.accion = this.value;
    if (!t.accion) t.doc = null; else if (tarea('g').doc) t.doc = 'res';
    avanzar(); pintar();
  };

  inicial(); pintar();
})();
</script>
